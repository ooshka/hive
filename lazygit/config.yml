# hive lazygit config — symlinked to ~/.config/lazygit/config.yml by install.sh.
#
# The only thing we set here is the diff pager: route lazygit's diffs through
# delta (https://github.com/dandavison/delta) for syntax highlighting and
# word-level intra-line diffs. delta is a single static binary (see
# REQUIREMENTS.md); all of its options live in the pager string below, so this
# stays self-contained and never touches your global ~/.gitconfig.
git:
  paging:
    # colorArg always: hand delta pre-coloured input so it controls the styling.
    colorArg: always
    # --paginate=never: lazygit owns scrolling, so delta must not page itself.
    # --line-numbers:   before/after line numbers in the gutter.
    # Add --side-by-side for a split view — handy, but can feel cramped in
    # lazygit's narrow diff panel, so it's left off by default. Try it and see.
    pager: delta --paginate=never --line-numbers
